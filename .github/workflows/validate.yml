name: Validate Cuentiva
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Check toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Model tests and bundled content
        run: bash scripts/verify.sh
      - name: Select an available iPhone simulator
        run: |
          xcrun simctl list devices available --json > /tmp/cuentiva-simulators.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('/tmp/cuentiva-simulators.json'))
          phones = [d for runtime, devices in data['devices'].items() if 'iOS-26' in runtime for d in devices if d['name'].startswith('iPhone')]
          if not phones:
              raise SystemExit('Install Xcode 26.2+ and an iOS 26 simulator on this runner.')
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write('CUENTIVA_SIMULATOR=' + phones[0]['udid'] + '\n')
          PY
      - name: iOS tests
        run: xcodebuild -project Cuentiva.xcodeproj -scheme Cuentiva -destination "id=$CUENTIVA_SIMULATOR" -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test
      - name: Release simulator build
        run: xcodebuild -project Cuentiva.xcodeproj -scheme Cuentiva -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iOS-test-results
          path: TestResults.xcresult
          if-no-files-found: ignore
